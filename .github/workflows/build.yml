name: build
on:
  push:
    paths-ignore: ['*.md']
  pull_request:
  workflow_dispatch:

env:
  IS_THIS_RELEASE: false

jobs:
  build:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, 'SKIP') }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_USERNAME: ${{ secrets.GH_USERNAME }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Setup jdk
        uses: actions/setup-java@v5
        with:
          distribution: 'liberica'
          java-version: '25'

      - name: Cache Gradle dependencies
        id: gradle-cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ./.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-common
            ${{ runner.os }}-gradle-

      - name: Make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Get latest short hash
        run: echo "COMMIT_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Download dependencies
        if: |
          steps.gradle-cache.outputs.cache-hit != 'true' ||
          contains(github.event.head_commit.message, 'DEPS')
        run: ./gradlew dependencies --stacktrace

      - name: Build
        run: ./gradlew :fabricWrapper:build

      - name: Collect mod jars
        run: |
          shopt -s extglob
          mkdir mod-jars
          for jar in fabricWrapper/build/libs/!(*-@(dev|sources|shadow)).jar; do
              cp -p "$jar" mod-jars/
          done
          for jar in fabricWrapper/build/tmp/submods/META-INF/jars/!(*-@(dev|sources|shadow)).jar; do
              cp -p "$jar" mod-jars/
          done
          ls -l mod-jars

      - name: Upload mod jars
        uses: actions/upload-artifact@v7
        with:
          name: test-${{ env.COMMIT_HASH }}
          path: mod-jars/*.jar

      - name: Capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: litematica-printer-${{ env.COMMIT_HASH }}
          path: fabricWrapper/build/libs/*.jar

      - name: Capture build artifacts single version
        uses: actions/upload-artifact@v7
        with:
          name: litematica-printer-single-${{ env.COMMIT_HASH }}
          path: fabricWrapper/build/tmp/submods/META-INF/jars/*.jar